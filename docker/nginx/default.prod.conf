limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

upstream frontend_upstream { server frontend:8080; }
upstream backend_upstream { server app:9090; }

server {
    listen 8080;
    server_name _;
    location = /healthz { access_log off; return 200; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/demo00/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo00/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 10m;

    location = /healthz { access_log off; return 200; }
    location = /auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 310s;
        add_header X-Accel-Buffering no;
    }
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }
    include /etc/nginx/grafana-auth/*.conf;
}
