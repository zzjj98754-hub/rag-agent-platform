# 边缘反代:SPA 静态 + /api 后端(SSE)+ /grafana 子路径(prod,glob include 注入)
# 注意 add_header 继承规则:location 内定义任意 add_header 后,server 级不再继承,故各 location 显式声明。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

upstream frontend_upstream { server frontend:8080; }
upstream backend_upstream { server app:9090; }

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;   # 与 Spring multipart 10MB 上限一致,超大上传在边缘拦截

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_vary on;

    # server 级安全头:由未自定义 add_header 的 location(healthz、/auth/login)继承
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 自检端点:不触上游,供容器 healthcheck 使用
    location = /healthz {
        access_log off;
        return 200;
    }

    # 登录接口:独立限速防爆破(burst 10,5r/s)
    location = /auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://backend_upstream;      # 无尾斜杠:URI 原样透传
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API:剥离 /api 前缀;SSE 流式聊天核心路径
    location /api/ {
        limit_req zone=api burst=20 nodelay;     # 长连接 SSE 仅在建连时计数一次,不会掐断流
        proxy_pass http://backend_upstream/;     # 尾斜杠:剥离 /api 前缀
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 310s;
        add_header X-Accel-Buffering no;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA 静态资源
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # CSP 仅约束 SPA 文档;style-src 'unsafe-inline' 为 MUI/emotion 运行时样式所需
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # prod overlay 挂载 /etc/nginx/grafana-auth/*.conf;dev 无文件时 glob 无匹配 = 空操作
    include /etc/nginx/grafana-auth/*.conf;
}
