# prod 抓取配置:app 指标 + 主机指标(node-exporter,经 host-gateway)
# 抓取不配置认证:app 端口从不发布主机、Prometheus 仅在内网网络 —— 网络即安全边界
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: demo00-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
