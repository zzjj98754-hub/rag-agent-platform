spring.application.name=demo00
server.port=9090
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# ==================== 日志配置 ====================
# Logback 配置文件路径（可选，Spring Boot 自动查找 classpath:logback-spring.xml）
# logging.config=classpath:logback-spring.xml
# 应用日志级别
logging.level.com.example.demo=INFO
# Web 层日志
logging.level.org.springframework.web=WARN
# 启用 Tomcat 访问日志（配合 RequestLoggingFilter 使用）
server.tomcat.accesslog.enabled=false

# ==================== HTTP 客户端超时配置 ====================
# 连接超时（秒）—— TCP 三次握手的最大等待时间，超过则放弃建连
app.llm.connect-timeout=3
# 读取超时（秒）—— 等待 LLM 响应的最大时间，防止长时间挂起
app.llm.read-timeout=30
# 外部 LLM API 地址（演示用本机内置 mock 端点）
app.llm.url=http://localhost:9090/mock-llm

# ==================== Redis 配置 ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 连接超时
spring.data.redis.timeout=3s
# Lettuce 连接池
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3s

# ==================== 会话上下文配置 ====================
# 会话历史最大保留条数（滑动窗口）
app.session.max-history=20
# 会话 TTL（秒），7 天无活动自动过期
app.session.ttl=604800

# ==================== 缓存 TTL（秒）====================
# 基础 TTL
app.cache.ttl=3600
# TTL 抖动比例，避免缓存雪崩（0.1 = ±10%）
app.cache.ttl-jitter=0.1

# ==================== Agent / Tool Calling 配置 ====================
# 单次 Agent 循环最大推理步数（防止 LLM 无限调用工具）
app.agent.max-steps=10
# 单步工具执行超时（毫秒）
app.agent.step-timeout-ms=30000
# 死循环检测阈值（连续 N 次相同工具+相同参数判定为死循环）
app.agent.dead-loop-threshold=3

# ==================== VectorStore 配置 ====================
# 向量存储后端：in-memory | redis-stack（未来） | pgvector（未来）
app.vector-store.backend=in-memory

# ==================== RAG 配置 ====================
# 向量检索 Top-K（返回最相似的 K 个 chunk）
app.rag.top-k=3
# RAG 相关性门控阈值（Reranker 最高分 < 此值 → 不传文档给 LLM，直接告知「未找到」）
app.rag.relevance-threshold=0.35

# ==================== Embedding API 配置（硅基流动）====================
# API Key
app.embedding.api-key=sk-qcudtunjtkowbunktskapukbhqzweqcfmfsxdkejxpufwisy
# Embedding API 地址
app.embedding.url=https://api.siliconflow.cn/v1/embeddings
# Embedding 模型（BGE 中文大模型，1024 维）
app.embedding.model=BAAI/bge-large-zh-v1.5
# 批量嵌入单次最大条数（硅基流动限制 32 条/次）
app.embedding.batch-size=32
# 失败重试次数（不含首次调用，0=不重试）
app.embedding.retry-max=2
# 重试退避基础间隔（毫秒，第 n 次重试延迟 = backoff * n）
app.embedding.retry-backoff-ms=500

# ==================== Embedding 弹性配置 ====================
# 查询缓存最大条目数（FIFO 淘汰）
app.embedding.cache-max-size=2000
# 熔断器阈值（连续失败 N 次后打开熔断器）
app.embedding.circuit-threshold=3
# 熔斷器冷却时间（秒，超时后进入半开状态探测）
app.embedding.circuit-cooldown-seconds=60

# ==================== Reranker API 配置（硅基流动 BGE Reranker，免费）====================
# API Key（与 Embedding 共用同一个硅基流动 Key）
app.reranker.api-key=${app.embedding.api-key}
# Reranker API 地址
app.reranker.url=https://api.siliconflow.cn/v1/rerank
# Reranker 模型（Cross-Encoder，query+doc 联合编码）
app.reranker.model=BAAI/bge-reranker-v2-m3

# ==================== MySQL DataSource 配置 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/demo00?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ==================== HikariCP 连接池配置（Spring Boot 默认） ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
