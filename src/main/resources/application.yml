spring:
  application:
    name: demo00
  profiles:
    default: dev
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://localhost:3306/demo00?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 9090
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
  tomcat:
    accesslog:
      enabled: false

logging:
  level:
    com.example.demo: INFO
    org.springframework.web: WARN

app:
  web:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
    async:
      default-timeout-ms: 300000
  document:
    allowed-extensions: txt,md,pdf
  llm:
    connect-timeout: 3
    read-timeout: 30
    url: "${LLM_URL:}"
    model: "${LLM_MODEL:default}"
    streaming:
      url: "${STREAMING_LLM_URL:}"
      api-key: "${STREAMING_LLM_API_KEY:}"
      model: "${STREAMING_LLM_MODEL:default}"
      emitter-timeout-ms: 300000
      heartbeat-interval-ms: 15000
      heartbeat-threads: 1
      retry-ms: 3000
      buffer-capacity: 256
      send-executor:
        core-size: 4
        max-size: 16
        queue-capacity: 1000
      replay:
        max-events: 512
        ttl-ms: 300000
  session:
    max-history: 40
    ttl: 604800
  outbox:
    poll-interval-ms: 500
    batch-size: 50
    max-retries: 8
    retry-delay-seconds: 5
  cache:
    ttl: 3600
    ttl-jitter: 0.1
  agent:
    max-steps: 5
    step-timeout-ms: 30000
    dead-loop-threshold: 3
    tool-threads: 4
    tool-queue-capacity: 100
    function-calling:
      enabled: "${AGENT_FUNCTION_CALLING_ENABLED:false}"
      url: "${AGENT_LLM_URL:https://api.openai.com/v1/chat/completions}"
      api-key: "${AGENT_LLM_API_KEY:}"
      model: "${AGENT_LLM_MODEL:gpt-4o-mini}"
      thinking-mode: "${AGENT_LLM_THINKING_MODE:omit}"
  security:
    jwt:
      secret: "${JWT_SECRET:demo00-development-only-jwt-secret-change-before-production}"
      issuer: demo00
      expiration-seconds: 7200
    bootstrap-admin:
      enabled: false
      username: admin
      password: "${BOOTSTRAP_ADMIN_PASSWORD:}"
  vector-store:
    backend: in-memory
  rag:
    top-k: 3
    relevance-thresholds:
      bge: 0.35
      rrf: 0.01
    executor:
      core-size: 4
      max-size: 16
      queue-capacity: 200
    async:
      core-size: 2
      max-size: 8
      queue-capacity: 100
  ingestion:
    startup-enabled: true
    docs-path: "${RAG_DOCS_PATH:D:/docs}"
  embedding:
    api-key: "${EMBEDDING_API_KEY:}"
    url: https://api.siliconflow.cn/v1/embeddings
    model: BAAI/bge-large-zh-v1.5
    batch-size: 32
    retry-max: 2
    retry-backoff-ms: 500
    cache-max-size: 2000
    circuit-threshold: 3
    circuit-cooldown-seconds: 60
  reranker:
    api-key: "${EMBEDDING_API_KEY:}"
    url: https://api.siliconflow.cn/v1/rerank
    model: BAAI/bge-reranker-v2-m3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: "${spring.application.name}"

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.demo.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"
