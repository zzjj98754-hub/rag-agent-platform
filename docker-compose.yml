name: demo00-rag

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-demo00}
      MYSQL_USER: ${MYSQL_USER:-demo00}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-demo00-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-password}
      TZ: ${TZ:-Asia/Hong_Kong}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  app:
    image: demo00-rag-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-demo00}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-demo00}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-demo00-local-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RAG_DOCS_PATH: /app/docs
      APP_INGESTION_STARTUP_ENABLED: ${STARTUP_INGESTION_ENABLED:-false}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      STREAMING_LLM_URL: ${STREAMING_LLM_URL:-http://localhost:9090/mock-llm/stream}
      STREAMING_LLM_API_KEY: ${STREAMING_LLM_API_KEY:-}
      STREAMING_LLM_MODEL: ${STREAMING_LLM_MODEL:-default}
      AGENT_FUNCTION_CALLING_ENABLED: ${AGENT_FUNCTION_CALLING_ENABLED:-false}
      AGENT_LLM_URL: ${AGENT_LLM_URL:-https://api.deepseek.com/chat/completions}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-v4-flash}
      AGENT_LLM_THINKING_MODE: ${AGENT_LLM_THINKING_MODE:-disabled}
      JWT_SECRET: ${JWT_SECRET:-docker-local-jwt-secret-change-before-production-32bytes}
      APP_SECURITY_BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      APP_SECURITY_BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      APP_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-docker-admin-change-me}
      TZ: ${TZ:-Asia/Hong_Kong}
    expose:
      - "9090"
    volumes:
      - type: bind
        source: ${RAG_DOCS_PATH:-./docker/docs}
        target: /app/docs
        read_only: true
      - app-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - app
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - backend

volumes:
  mysql-data:
  redis-data:
  app-logs:
  prometheus-data:
  grafana-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
